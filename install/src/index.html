<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>系统安装</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#install-main">跳到安装内容</a>
    <div class="page-shell">
      <header class="site-header" aria-label="产品标识">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <path d="M12 2.4 20 6v6.1c0 4.5-3.2 8.2-8 9.5-4.8-1.3-8-5-8-9.5V6l8-3.6Z" />
            <path d="m8.4 12 2.2 2.2 5-5" />
          </svg>
        </span>
        <span>
          <strong>Gin Vben Admin</strong>
          <small>首次安装</small>
        </span>
      </header>

      <main id="install-main" class="install-layout" tabindex="-1">
        <section class="intro" aria-labelledby="install-title">
          <p class="eyebrow">安全、可验证的初始化</p>
          <h1 id="install-title"><span class="title-line">配置你的</span><span class="title-line">管理系统</span></h1>
          <p class="intro-copy">
            安装向导会在提交前检查运行环境与连接状态，并清晰展示每一步结果。
          </p>
          <ol class="steps" aria-label="安装步骤">
            <li aria-current="step"><span>1</span>环境检查</li>
            <li><span>2</span>界面与服务</li>
            <li><span>3</span>管理员</li>
            <li><span>4</span>确认安装</li>
          </ol>
        </section>

        <section class="status-card" aria-labelledby="status-title">
          <div class="status-card__header">
            <div>
              <p class="section-label">实例状态</p>
              <h2 id="status-title">正在检查安装状态</h2>
            </div>
            <span id="status-badge" class="status-badge" data-tone="pending">检查中</span>
          </div>

          <div id="status-message" class="status-message" role="status" aria-live="polite">
            正在连接本机安装服务，请稍候。
          </div>

          <dl id="status-details" class="status-details" hidden>
            <div>
              <dt>安装器版本</dt>
              <dd id="installer-version">—</dd>
            </div>
            <div>
              <dt>管理界面</dt>
              <dd id="selected-ui">—</dd>
            </div>
            <div>
              <dt>运行模式</dt>
              <dd id="selected-mode">—</dd>
            </div>
          </dl>

          <button id="retry-button" class="secondary-button" type="button" hidden>
            重新检查
          </button>
        </section>
      </main>

      <footer>所有检查均由本机安装服务完成。</footer>
    </div>
    <noscript>请启用 JavaScript 以运行安装向导。</noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
