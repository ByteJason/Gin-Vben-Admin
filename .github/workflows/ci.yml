name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 11.16.0
  NODE_VERSION: 24.16.0

jobs:
  platform-smoke:
    name: Platform smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Run cross-platform bootstrap check
        run: node scripts/bootstrap.mjs --check
      - name: Run basic verification
        run: node scripts/verify.mjs --scope basic
      - name: Check dev orchestrator
        run: node scripts/dev.mjs --check --ui antd

  contract:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run root contract tests
        run: node --test tests/contract/contract.test.mjs

  admin:
    name: Admin UI gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml
      - name: Install workspace
        run: pnpm --dir admin install --frozen-lockfile
      - name: Build generated workspace stubs
        run: pnpm --dir admin -r run --if-present stub
      - name: Run admin smoke tests
        run: pnpm --dir admin run test:smoke
      - name: Build management UI templates
        run: |
          pnpm --dir admin run build:antd
          pnpm --dir admin run build:ele
          pnpm --dir admin run build:naive
      - name: Typecheck management UI templates
        run: |
          pnpm --dir admin --filter @vben/web-antd exec vue-tsc --noEmit --skipLibCheck
          pnpm --dir admin --filter @vben/web-ele exec vue-tsc --noEmit --skipLibCheck
          pnpm --dir admin --filter @vben/web-naive exec vue-tsc --noEmit --skipLibCheck
      - name: Install Chromium for accessibility gates
        run: pnpm --dir admin exec playwright install --with-deps chromium
      - name: Run management UI and installer E2E accessibility gates
        run: pnpm --dir admin run test:e2e:a11y

  server:
    name: Gin server gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: server/go.sum
      - name: Test
        run: go -C server test ./...
      - name: Vet
        run: go -C server vet ./...
      - name: Race test
        run: go -C server test -race ./...

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate development topology
        run: docker compose -f deploy/compose.dev.yaml config --quiet
      - name: Validate dependency topology
        run: docker compose -f deploy/compose.dependencies.yaml config --quiet

  integration:
    name: Single-node integration services
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gin_vben_admin
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gin_vben_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d gin_vben_admin"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:8.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Run server integration gates
        env:
          DATA_PLATFORM_INTEGRATION: '1'
          TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/gin_vben_admin?parseTime=true&charset=utf8mb4
          TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/gin_vben_admin?sslmode=disable
          TEST_REDIS_ADDR: 127.0.0.1:6379
        run: go -C server test ./tests/integration -count=1 -v

  release-gates:
    name: Reproducible RC release gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Generate deterministic SBOM
        run: |
          mkdir -p .runtime/release
          node scripts/release/sbom.mjs --output .runtime/release/sbom.cdx.json
          node scripts/release/license-policy.mjs \
            --sbom .runtime/release/sbom.cdx.json \
            --notice NOTICE > .runtime/release/license-summary.json
      - name: Run reproducibility checks
        run: |
          node scripts/release/sbom.mjs --output .runtime/release/sbom.cdx.json --check
          node scripts/release-smoke.mjs --check --ui antd,ele,naive
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: rc-release-evidence
          path: .runtime/release

  security-gates:
    name: Local security policy gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Generate security report
        run: |
          mkdir -p .runtime/security
          node scripts/security-gates.mjs --output .runtime/security/security-report.json
          node --test tests/security/security_gates.test.mjs
          node scripts/security-gates.mjs --output .runtime/security/security-report.json --check
      - name: Upload security evidence
        uses: actions/upload-artifact@v4
        with:
          name: rc-security-evidence
          path: .runtime/security
