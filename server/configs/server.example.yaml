version: 0.2.0-dev

server:
  addr: ":8080"
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 10s

logging:
  level: info

observability:
  # B6 contract only: exporters/collectors are wired and tested in B8.
  metrics_enabled: false
  metrics_endpoint: ""
  tracing_enabled: false
  otlp_endpoint: ""
  otlp_protocol: http/protobuf
  tls_verify: true
  sample_rate: 0
  otlp_api_key: ""

install:
  # Source development resolves this from server/ to the root install/ workspace.
  # Container deployments should set INSTALL_STATE_DIR to a persistent volume.
  state_dir: ../install

tenant:
  # single keeps the default tenant boundary; multi requires X-Tenant-ID on
  # every protected operation. X-Platform-Admin is never accepted from a
  # request; platform-admin scope is resolved by authenticated server code.
  enabled: true
  mode: single
  default_id: default
  tenant_header: X-Tenant-ID
  organization_header: X-Org-ID

database:
  enabled: false
  driver: mysql
  # mode options: single, read_write, cluster_endpoint
  # single/cluster_endpoint use dsn; read_write uses primary_dsn + replica_dsns.
  mode: single
  dsn: ""
  primary_dsn: ""
  replica_dsns: []
  read_policy: random
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 1h
  conn_max_idle_time: 15m
  ping_timeout: 5s

redis:
  enabled: false
  # mode options: single, sentinel, cluster
  # single uses addr; sentinel uses addrs + master_name; cluster uses at least
  # two addrs and requires db: 0.
  mode: single
  addr: "127.0.0.1:6379"
  username: ""
  password: ""
  db: 0
  namespace: app:v1
  addrs: []
  master_name: ""
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  ping_timeout: 3s

auth:
  # Enable only after setting AUTH_JWT_SECRET (at least 32 bytes) through the
  # local config file or environment; never commit a real secret.
  enabled: false
  jwt_secret: ""
  issuer: gin-vben-admin
  audience: admin
  access_ttl: 30m
  refresh_ttl: 168h
  refresh_cookie_name: refresh_token
  secure_cookie: false
  bcrypt_cost: 12
  rate_limit_window: 1m
  rate_limit_max_attempts: 10
  lockout_threshold: 5
  lockout_duration: 15m
  captcha_enabled: false
  captcha_risk_threshold: 3
  captcha_risk_window: 15m
  captcha_challenge_ttl: 2m
  captcha_key_prefix: auth-captcha
  registration_enabled: false

mail:
  # Optional SMTP transport. Keep disabled for local runs unless the isolated
  # Mailpit profile is enabled (deploy/compose.mailpit.yaml).
  enabled: false
  host: "127.0.0.1"
  port: 1025
  username: ""
  password: ""
  from: "no-reply@example.test"
  start_tls: false

file:
  enabled: true
  root: ../.runtime/files
  base_url: ""
  max_bytes: 104857600
  allowed_mimes: []
