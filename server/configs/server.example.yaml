# 可选的服务端部署配置。首次安装直接打开 /install，无需复制此文件。
# 手工部署时复制为 server/configs/server.yaml；根 .env 与环境变量优先。
# 这里只列部署输入；业务设置在管理端维护，其他参数使用 typed config 默认值。
# 真实连接和密钥保存在权限为 0600 的本地文件或环境变量中。

site:
  name: Gin-Vben-Admin
  logo: ""

server:
  addr: ":8080"

logging:
  # debug 才显示路由注册等诊断输出。
  level: info

# 相对于 server/ 进程工作目录。
install:
  state_dir: ../.runtime/install
  workspace_root: ..

# single、read_write、cluster_endpoint；/install 默认 PostgreSQL。
database:
  enabled: false
  driver: postgres
  mode: single
  dsn: ""

# single、sentinel、cluster；首次安装由 /install 写入实际连接。
redis:
  enabled: false
  mode: single
  addr: "127.0.0.1:6379"
  namespace: app:v1

auth:
  enabled: false
  jwt_secret: ""

# 本地存储根目录属于部署配置，不在管理端动态修改。
file:
  root: ./storage
