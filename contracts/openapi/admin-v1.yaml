openapi: 3.1.0
info:
  title: APP Admin API
  version: 0.2.0-dev
  description: |
    管理端 HTTP API。
servers:
  - url: /
    description: Local development
tags:
  - name: Health
  - name: Admin
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveHealth
      summary: Liveness probe
      responses:
        '200':
          $ref: '#/components/responses/HealthResponse'
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadyHealth
      summary: Readiness probe
      responses:
        '200':
          $ref: '#/components/responses/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/admin/v1/ping:
    get:
      tags: [Admin]
      operationId: adminPing
      summary: 管理端服务连通性检查
      responses:
        '200':
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/admin/v1/auth/captcha:
    get:
      tags: [Admin]
      operationId: issueAdminAuthCaptcha
      summary: 获取当前验证码 provider 的一次性挑战
      responses:
        '200':
          description: 验证码挑战已签发；响应不包含答案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaSuccessEnvelope'
        '503':
          $ref: '#/components/responses/AuthServiceUnavailable'
  /api/admin/v1/auth/login:
    post:
      tags: [Admin]
      operationId: adminAuthLogin
      summary: 管理端登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              credentials:
                value:
                  username: USERNAME
                  password: PASSWORD
      responses:
        '200':
          description: 登录成功；refresh token 只通过 HttpOnly cookie 返回
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessEnvelope'
        '400':
          $ref: '#/components/responses/LoginBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthServiceUnavailable'
  /api/admin/v1/auth/refresh:
    post:
      tags: [Admin]
      operationId: adminAuthRefresh
      summary: 使用 refresh cookie 轮换 access token
      security:
        - RefreshCookie: []
      parameters:
        - $ref: '#/components/parameters/RefreshTokenCookie'
      responses:
        '200':
          description: access token 轮换成功；旧 refresh token 立即失效
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AuthServiceUnavailable'
  /api/admin/v1/auth/logout:
    post:
      tags: [Admin]
      operationId: adminAuthLogout
      summary: 吊销当前 refresh session
      security:
        - RefreshCookie: []
      parameters:
        - $ref: '#/components/parameters/RefreshTokenCookie'
      responses:
        '200':
          description: 登出成功；refresh cookie 被清除
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/ClearedRefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AuthServiceUnavailable'
  /api/admin/v1/auth/register:
    post:
      tags: [Admin]
      operationId: adminAuthRegister
      summary: 创建管理端账号（按配置开关开放）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/AuthServiceUnavailable'
  /api/admin/v1/auth/password/reset/request:
    post:
      tags: [Admin]
      operationId: requestAdminPasswordReset
      summary: 请求一次性密码重置（不暴露账号是否存在）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/AuthServiceUnavailable'
  /api/admin/v1/auth/password/reset:
    post:
      tags: [Admin]
      operationId: resetAdminPassword
      summary: 使用一次性 token 设置新密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetTokenRequest'
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AuthServiceUnavailable'
  /api/admin/v1/auth/sessions:
    get:
      tags: [Admin]
      operationId: listAdminAuthSessions
      summary: 查询当前账号的设备会话
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AuthServiceUnavailable'
  /api/admin/v1/auth/sessions/{id}:
    delete:
      tags: [Admin]
      operationId: revokeAdminAuthSession
      summary: 吊销当前账号的指定设备会话
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AuthServiceUnavailable'
  /api/admin/v1/iam/me:
    get:
      tags: [IAM]
      operationId: getCurrentAdminUser
      summary: 查询当前管理端用户资料
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: 当前用户资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/AuthServiceUnavailable' }
  /api/admin/v1/iam/users:
    get:
      tags: [IAM]
      operationId: listIAMUsers
      summary: 查询管理用户
      security: [{BearerAuth: []}]
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: keyword
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [all, active, disabled] }
        - name: roleId
          in: query
          required: false
          schema: { type: string }
        - name: orgId
          in: query
          required: false
          schema: { type: string }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [id, -id, username, -username, displayName, -displayName, email, -email, lastLoginAt, -lastLoginAt, orgId, -orgId] }
      responses:
        '200':
          description: 分页用户查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/IAMUserPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/AuthServiceUnavailable' }
    post:
      tags: [IAM]
      operationId: createIAMUser
      summary: 保存管理用户
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IAMUserCreateRequest' }
      responses:
        '200':
          description: 用户创建成功；密码永不回显
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/IAMUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IAMUserConflict' }
        '503': { $ref: '#/components/responses/AuthServiceUnavailable' }
  /api/admin/v1/iam/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    get:
      tags: [IAM]
      operationId: getIAMUser
      summary: 查询单个管理用户
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: 用户详情查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/IAMUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AuthServiceUnavailable' }
    patch:
      tags: [IAM]
      operationId: updateIAMUser
      summary: 更新管理用户资料与状态
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IAMUserUpdateRequest' }
      responses:
        '200':
          description: 用户更新成功；密码永不回显
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/IAMUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IAMUserConflict' }
        '503': { $ref: '#/components/responses/AuthServiceUnavailable' }
  /api/admin/v1/iam/roles:
    get:
      tags: [IAM]
      operationId: listIAMRoles
      summary: 查询角色
      security: [{BearerAuth: []}]
      responses:
        '200': { $ref: '#/components/responses/CollectionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [IAM]
      operationId: createIAMRole
      summary: 保存角色
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IAMRoleRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/v1/iam/menus:
    get:
      tags: [IAM]
      operationId: listIAMMenus
      summary: 查询菜单
      security: [{BearerAuth: []}]
      responses:
        '200': { $ref: '#/components/responses/CollectionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/v1/menu/all:
    get:
      tags: [IAM]
      operationId: listVisibleMenus
      summary: 查询当前用户菜单
      security: [{BearerAuth: []}]
      responses:
        '200': { $ref: '#/components/responses/CollectionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/v1/iam/permissions:
    get:
      tags: [IAM]
      operationId: listIAMPermissions
      summary: 查询 API 权限
      security: [{BearerAuth: []}]
      responses:
        '200': { $ref: '#/components/responses/CollectionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/v1/iam/policies:
    get:
      tags: [IAM]
      operationId: listIAMPolicies
      summary: 查询授权策略
      security: [{BearerAuth: []}]
      responses:
        '200': { $ref: '#/components/responses/CollectionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [IAM]
      operationId: createIAMPolicy
      summary: 保存授权策略
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IAMPolicyRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/v1/iam/data-scopes:
    get:
      tags: [IAM]
      operationId: listIAMDataScopes
      summary: 查询数据范围
      security: [{BearerAuth: []}]
      responses:
        '200': { $ref: '#/components/responses/CollectionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [IAM]
      operationId: createIAMDataScope
      summary: 保存数据范围
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IAMDataScopeRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/v1/settings:
    get:
      tags: [Settings]
      operationId: listSettingDefinitions
      summary: 查询系统设置定义
      security: [{BearerAuth: []}]
      responses:
        '200': { $ref: '#/components/responses/SettingDefinitionsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/AuthServiceUnavailable' }
  /api/admin/v1/settings/{key}:
    get:
      tags: [Settings]
      operationId: getSetting
      summary: 查询单项系统设置
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/SettingKey'
      responses:
        '200': { $ref: '#/components/responses/SettingResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AuthServiceUnavailable' }
    put:
      tags: [Settings]
      operationId: updateSetting
      summary: 以乐观版本号更新系统设置
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/SettingKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/SettingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/SettingConflict' }
        '503': { $ref: '#/components/responses/AuthServiceUnavailable' }
  /api/admin/v1/settings/{key}/history:
    get:
      tags: [Settings]
      operationId: listSettingHistory
      summary: 查询设置历史版本
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/SettingKey'
      responses:
        '200': { $ref: '#/components/responses/SettingHistoryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/v1/settings/{key}/rollback:
    post:
      tags: [Settings]
      operationId: rollbackSetting
      summary: 回滚设置到指定历史版本
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/SettingKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingRollbackRequest' }
      responses:
        '200': { $ref: '#/components/responses/SettingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/SettingConflict' }
        '503': { $ref: '#/components/responses/AuthServiceUnavailable' }
  /api/admin/v1/audit/events:
    get:
      tags: [Audit]
      operationId: queryAuditEvents
      summary: 分页查询管理审计事件
      security: [{BearerAuth: []}]
      parameters:
        - { name: actorId, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: resource, in: query, schema: { type: string } }
        - { name: outcome, in: query, schema: { type: string } }
        - { name: requestId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 0, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { $ref: '#/components/responses/AuditPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/AuthServiceUnavailable' }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '受保护管理端请求使用 Authorization: Bearer TOKEN'
    RefreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly、SameSite=Lax 的 refresh token cookie（生产环境启用 Secure）；不会出现在 JSON 响应中
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    RefreshTokenCookie:
      name: refresh_token
      in: cookie
      required: true
      description: 浏览器自动附带的 HttpOnly refresh token cookie
      schema:
        type: string
        minLength: 1
    SettingKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  schemas:
    HealthData:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready, unavailable]
        check:
          type: string
          enum: [live]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [up, down]
    SuccessEnvelope:
      type: object
      required: [code, message, data, traceId, meta]
      properties:
        code:
          type: integer
          const: 0
        message:
          type: string
        data: {}
        traceId:
          type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    EmptySuccessEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: 'null'
    AuthSuccessEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AuthTokenData'
    CaptchaSuccessEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CaptchaChallenge'
    CurrentUserEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CurrentUser'
    CaptchaChallenge:
      type: object
      additionalProperties: false
      required: [id, kind, expiresIn]
      properties:
        id:
          type: string
          minLength: 1
        kind:
          type: string
          description: image、slider、turnstile 或 provider 自定义类型
        payload:
          type: string
          description: 可公开渲染数据（图片 provider 返回 data URI）；答案不作为字段、日志或 Redis 明文保存
        expiresIn:
          type: integer
          minimum: 1
    LoginRequest:
      type: object
      additionalProperties: false
      required: [password]
      anyOf:
        - required: [username]
        - required: [identifier]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
          description: 兼容字段；与 identifier 二选一
        identifier:
          type: string
          minLength: 1
          maxLength: 254
          description: 规范化前的用户名或邮箱
        identifierType:
          type: string
          enum: [username, email]
          description: 可选显式标识类型；服务端会校验与 identifier 一致
        password:
          type: string
          minLength: 1
          maxLength: 256
        captcha:
          type: string
          maxLength: 256
        captchaId:
          type: string
          maxLength: 256
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 8
          maxLength: 128
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
    PasswordResetTokenRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
        password:
          type: string
          minLength: 8
          maxLength: 128
    SessionData:
      type: object
      additionalProperties: false
      required: [id, deviceId, deviceName, ipAddress, userAgent, expiresAt, revoked]
      properties:
        id: { type: string, minLength: 1 }
        deviceId: { type: string }
        deviceName: { type: string }
        ipAddress: { type: string }
        userAgent: { type: string }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        revoked: { type: boolean }
    AuthTokenData:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          minLength: 1
          description: 短时效 access token；客户端通过 Bearer header 发送
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: access token 有效期（秒）
    IAMUser:
      type: object
      required: [id, username, active, roleIds]
      properties:
        id: { type: string, minLength: 1 }
        username: { type: string, minLength: 1 }
        displayName: { type: string }
        nickname: { type: string }
        avatar: { type: string }
        email: { type: string, format: email }
        phone: { type: string, pattern: '^\\+[1-9][0-9]{7,14}$' }
        lastLoginIp: { type: string }
        lastLoginAt: { type: string, format: date-time }
        passwordChangedAt: { type: string, format: date-time }
        tenantId: { type: string }
        orgId: { type: string }
        active: { type: boolean }
        status: { type: string, enum: [active, disabled] }
        roleIds:
          type: array
          items: { type: string }
    IAMUserPage:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/IAMUser' }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
    CurrentUser:
      type: object
      additionalProperties: false
      required: [userId, username, realName, avatar, roles, homePath, desc]
      properties:
        userId: { type: string, minLength: 1 }
        username: { type: string, minLength: 1 }
        realName: { type: string }
        avatar: { type: string }
        nickname: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        lastLoginIp: { type: string }
        lastLoginAt: { type: string, format: date-time }
        passwordChangedAt: { type: string, format: date-time }
        roles:
          type: array
          items: { type: string }
        homePath: { type: string }
        desc: { type: string }
    IAMUserCreateRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 191 }
        nickname: { type: string, maxLength: 191 }
        avatar: { type: string, maxLength: 512 }
        email: { type: string, format: email }
        phone: { type: string, pattern: '^\\+[1-9][0-9]{7,14}$' }
        orgId: { type: string, maxLength: 128 }
        active: { type: boolean, default: true }
        password: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
    IAMUserUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1, maxLength: 191 }
        nickname: { type: string, maxLength: 191 }
        avatar: { type: string, maxLength: 512 }
        email: { type: string, format: email }
        phone: { type: string, pattern: '^\\+[1-9][0-9]{7,14}$' }
        orgId: { type: string, maxLength: 128 }
        active: { type: boolean }
    IAMUserRequest:
      allOf:
        - $ref: '#/components/schemas/IAMUserCreateRequest'
    IAMRole:
      type: object
      required: [id, name, active, dataScope]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        active: { type: boolean }
        dataScope: { type: string, enum: [all, own, org, custom] }
        userIds:
          type: array
          items: { type: string }
    IAMRoleRequest:
      allOf:
        - $ref: '#/components/schemas/IAMRole'
    IAMMenu:
      type: object
      required: [id, name, path, visible, active]
      properties:
        id: { type: string }
        parentId: { type: string }
        name: { type: string }
        path: { type: string }
        visible: { type: boolean }
        active: { type: boolean }
    IAMPermission:
      type: object
      required: [id, name, method, path, active]
      properties:
        id: { type: string }
        name: { type: string }
        method: { type: string }
        path: { type: string }
        active: { type: boolean }
    IAMPolicy:
      type: object
      required: [method, path, effect]
      properties:
        subject: { type: string }
        roleId: { type: string }
        domain: { type: string }
        method: { type: string }
        path: { type: string }
        effect: { type: string, enum: [allow, deny] }
    IAMPolicyRequest:
      allOf:
        - $ref: '#/components/schemas/IAMPolicy'
    IAMDataScope:
      type: object
      required: [resource, scope, ids]
      properties:
        subject: { type: string }
        roleId: { type: string }
        domain: { type: string }
        resource: { type: string }
        scope: { type: string, enum: [all, own, org, custom] }
        ids:
          type: array
          items: { type: string }
    IAMDataScopeRequest:
      allOf:
        - $ref: '#/components/schemas/IAMDataScope'
    SettingDefinition:
      type: object
      required: [key, kind, sensitive]
      properties:
        key: { type: string }
        kind: { type: string, enum: [string, bool, number, json, secret] }
        sensitive: { type: boolean }
        default: { type: string }
        allowed:
          type: array
          items: { type: string }
    SettingData:
      type: object
      required: [key, value, version, sensitive]
      properties:
        key: { type: string }
        value: { type: string }
        version: { type: integer, minimum: 0 }
        sensitive: { type: boolean }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    SettingUpdateRequest:
      type: object
      required: [value, expectedVersion]
      properties:
        value: {}
        expectedVersion: { type: integer, minimum: 0 }
    SettingRollbackRequest:
      type: object
      required: [version, expectedVersion]
      properties:
        version: { type: integer, minimum: 1 }
        expectedVersion: { type: integer, minimum: 1 }
    AuditEvent:
      type: object
      required: [id, action, resource, outcome, requestId, createdAt]
      properties:
        id: { type: string }
        actorId: { type: string }
        action: { type: string }
        resource: { type: string }
        outcome: { type: string }
        requestId: { type: string }
        details: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    AuditPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
    ErrorEnvelope:
      type: object
      required: [code, message, data, traceId, meta]
      properties:
        code:
          type: integer
        message:
          type: string
        data: {}
        traceId:
          type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    ResponseMeta:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
    FieldError:
      type: object
      required: [messageKey]
      properties:
        field:
          type: string
        messageKey:
          type: string
        params:
          type: object
          additionalProperties: true
  responses:
    SuccessResponse:
      description: 请求成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
    CollectionResponse:
      description: 集合查询成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
    SettingDefinitionsResponse:
      description: 设置定义查询成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SettingDefinition' }
    SettingResponse:
      description: 设置读取或写入成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/SettingData' }
    SettingHistoryResponse:
      description: 设置历史查询成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SettingData' }
    AuditPageResponse:
      description: 审计事件查询成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/AuditPage' }
    IAMUserConflict:
      description: 用户名或邮箱在当前租户内已存在
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    const: 10011
    SettingConflict:
      description: 设置版本已变化，需要重新读取后再写入
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    const: 10010
    NotFound:
      description: 资源不存在
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    const: 10001
    Forbidden:
      description: 当前主体没有资源权限；服务端默认拒绝
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    const: 30000
    HealthResponse:
      description: 服务存活或就绪
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HealthData'
    BadRequest:
      description: 请求参数错误
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    const: 10000
    ValidationFailed:
      description: 请求字段通过语法解析但未通过业务校验
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    const: 10001
    LoginBadRequest:
      description: 登录请求字段或验证码无效
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    enum: [10000, 10005]
    Unauthorized:
      description: 未认证或凭据错误
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    enum: [10002, 10003, 20000]
    ServiceUnavailable:
      description: 服务未就绪
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    const: 40001
                  data:
                    $ref: '#/components/schemas/HealthData'
    RateLimited:
      description: 登录尝试超过账号或来源限制
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    const: 10004
    AuthServiceUnavailable:
      description: 认证依赖不可用或认证未启用
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    const: 40001
  headers:
    RequestId:
      description: 用于跨服务追踪的请求 ID
      schema:
        type: string
    RefreshCookie:
      description: refresh token；服务端必须设置 HttpOnly、SameSite=Lax 和 Path 属性，生产环境启用 Secure
      schema:
        type: string
        example: refresh_token=TOKEN; Path=/api/admin/v1/auth; HttpOnly; SameSite=Lax
    ClearedRefreshCookie:
      description: 过期的 refresh token cookie，用于登出清理
      schema:
        type: string
        example: refresh_token=; Max-Age=0; Path=/api/admin/v1/auth; HttpOnly; SameSite=Lax
