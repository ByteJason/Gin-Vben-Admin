    FileSignedURLRequest:
      type: object
      properties:
        ttlSeconds: { type: integer, minimum: 1, maximum: 86400, default: 900 }
    FileSignedURL:
      type: object
      required: [url, expiresIn]
      properties:
        url: { type: string, format: uri }
        expiresIn: { type: integer, minimum: 1 }
