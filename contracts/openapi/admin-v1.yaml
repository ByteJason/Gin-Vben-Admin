  /api/admin/v1/dashboard/summary:
    get:
      tags: [Admin]
      operationId: getDashboardSummary
      summary: 获取运行概览的真实聚合摘要
      description: 需要 dashboard:overview:read；仅返回租户范围计数、实例/version/uptime 与 DB/Redis 状态，不暴露连接池、keyspace、地址或凭据。
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: 当前租户的轻量运行概览
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DashboardSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/admin/v1/dashboard/overview:
    get:
      tags: [Admin]
      operationId: getDashboardOverview
      summary: 获取运行概览分析数据
      description: 需要 dashboard:overview:read；按租户范围返回可追溯的数据源标记、时间范围、卡片、趋势与公告。
      security: [{BearerAuth: []}]
      parameters:
        - name: preset
          in: query
          required: false
          schema: { $ref: '#/components/schemas/DashboardOverviewPreset' }
        - name: timezone
          in: query
          required: false
          schema: { type: string, default: UTC }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: granularity
          in: query
          required: false
          schema: { $ref: '#/components/schemas/DashboardOverviewGranularity' }
      responses:
        '200':
          description: 当前租户的运行概览分析
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DashboardOverview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/admin/v1/ops/monitor:
    get:
      tags: [Admin]
      operationId: getMonitorOverview
      summary: 获取 IAM 访问码保护的只读资源快照
      description: 需要 ops:monitor:read；每个可选指标通过 capabilities 区分合法零值与采集不可用，不返回地址、DSN、凭据、原始命令或路径。
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: 当前进程/容器与依赖状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MonitorOverview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/admin/v1/ops/server-status:
    get:
      tags: [Admin]
      operationId: getServerStatus
      summary: 获取规范化服务器状态快照
      description: 需要 ops:monitor:read；返回与旧 monitor 端点兼容的受限运行时指标及刷新元数据。
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: 当前进程、容器与依赖状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MonitorServerStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '受保护管理端请求使用 Authorization: Bearer TOKEN'
    RefreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly、SameSite=Lax 的 refresh token cookie（生产环境启用 Secure）；不会出现在 JSON 响应中
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    RefreshTokenCookie:
      name: refresh_token
      in: cookie
      required: true
      description: 浏览器自动附带的 HttpOnly refresh token cookie
      schema:
        type: string
        minLength: 1
    SettingKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ObservabilitySettingKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        enum:
          - observability.metrics.enabled
          - observability.metrics.endpoint
          - observability.tracing.enabled
          - observability.tracing.endpoint
          - observability.tracing.protocol
          - observability.tracing.tls_verify
          - observability.tracing.sample_rate
          - observability.otlp.api_key
    FileId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    FileCategoryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    NotificationCallerId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    NotificationAccountId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    NotificationTemplateId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    VerificationPolicyKey:
      name: policy_key
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    MediaResourceId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    MediaCategoryId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    MediaUsageId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  schemas:

    NotificationCaller:
      type: object
      required: [id, callerKey, name, enabled, systemOwned]
      properties:
        id: { type: string }
        key: { type: string }
        callerKey: { type: string, pattern: '^[A-Za-z0-9._-]+$' }
        name: { type: string }
        module: { type: string }
        enabled: { type: boolean }
        systemOwned: { type: boolean }
        scopeType: { type: string, enum: [system, tenant, org] }
        capabilities: { type: array, items: { type: string } }
        smtpAccountIds: { type: array, items: { type: string } }
        defaultAccountId: { type: string }
        routingPolicy: { type: string, enum: [weighted_random, round_robin] }
        weights: { type: object, additionalProperties: { type: integer, minimum: 1 } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    NotificationCallerInput:
      type: object
      properties:
        key: { type: string, pattern: '^[A-Za-z0-9._-]+$' }
        callerKey: { type: string, pattern: '^[A-Za-z0-9._-]+$' }
        name: { type: string, minLength: 1 }
        module: { type: string }
        enabled: { type: boolean }
        capabilities: { type: array, items: { type: string } }
        smtpAccountIds: { type: array, items: { type: string } }
        defaultAccountId: { type: string }
        routingPolicy: { type: string, enum: [weighted_random, round_robin] }
        weights: { type: object, additionalProperties: { type: integer, minimum: 1 } }
    NotificationCallerPatch:
      allOf: [{ $ref: '#/components/schemas/NotificationCallerInput' }]
    NotificationTemplate:
      type: object
      required: [id, templateKey, enabled, published]
      properties:
        id: { type: string }
        key: { type: string }
        templateKey: { type: string }
        purpose: { type: string }
        defaultLocale: { type: string }
        locale: { type: string }
        subject: { type: string }
        body: { type: string }
        variables: { type: array, items: { type: string } }
        locales: { type: object, additionalProperties: { $ref: '#/components/schemas/NotificationTemplateLocale' } }
        enabled: { type: boolean }
        published: { type: boolean }
        status: { type: string, enum: [draft, published, disabled] }
        generation: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    NotificationTemplateLocale:
      type: object
      required: [locale, subject, body]
      properties:
        locale: { type: string }
        subject: { type: string }
        body: { type: string }
    NotificationTemplateInput:
      type: object
      properties:
        templateKey: { type: string }
        key: { type: string }
        purpose: { type: string }
        defaultLocale: { type: string }
        locale: { type: string }
        subject: { type: string }
        body: { type: string }
        variables: { type: array, items: { type: string } }
        locales: { type: object, additionalProperties: { $ref: '#/components/schemas/NotificationTemplateLocale' } }
        enabled: { type: boolean }
        published: { type: boolean }
    NotificationTemplateTestInput:
      type: object
      required: [recipient]
      properties:
        recipient: { type: string, format: email }
        locale: { type: string, enum: [zh-CN, en-US] }
        variables: { type: object, description: 未提供的已声明变量会在 AdminTest 中使用本地化示例值, additionalProperties: { type: string } }
    NotificationTemplateTestResult:
      type: object
      required: [messageId, status, isTest]
      properties:
        messageId: { type: string }
        status: { type: string, enum: [queued, sent, failed] }
        isTest: { type: boolean, const: true }
    VerificationPolicy:
      type: object
      required: [policyKey, codeLength, ttlSeconds, maxFailures, resendIntervalSeconds, hourlyLimit]
      properties:
        policyKey: { type: string }
        key: { type: string }
        callerKey: { type: string }
        purpose: { type: string }
        codeLength: { type: integer, minimum: 4, maximum: 10 }
        charset: { type: string }
        ttlSeconds: { type: integer, minimum: 60, maximum: 1800 }
        maxFailures: { type: integer, minimum: 1 }
        resendIntervalSeconds: { type: integer, minimum: 1, maximum: 1800 }
        hourlyLimit: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    VerificationPolicyInput:
      type: object
      properties:
        key: { type: string }
        callerKey: { type: string }
        purpose: { type: string }
        codeLength: { type: integer, minimum: 4, maximum: 10 }
        length: { type: integer, minimum: 4, maximum: 10 }
        charset: { type: string }
        ttlSeconds: { type: integer, minimum: 60, maximum: 1800 }
        maxFailures: { type: integer, minimum: 1 }
        resendIntervalSeconds: { type: integer, minimum: 1, maximum: 1800 }
        resendAfterSeconds: { type: integer, minimum: 1, maximum: 1800 }
        hourlyLimit: { type: integer, minimum: 1 }
        maxSendsPerHour: { type: integer, minimum: 1 }
    VerificationIssueInput:
      type: object
      required: [purpose, recipient]
      properties:
        callerKey: { type: string }
        purpose: { type: string }
        recipient: { type: string, format: email }
        locale: { type: string }
        variables: { type: object, additionalProperties: { type: string } }
        idempotencyKey: { type: string }
    VerificationVerifyInput:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 1, maxLength: 32 }
        idempotencyKey: { type: string }
    VerificationChallenge:
      type: object
      required: [id, expiresAt, status]
      properties:
        id: { type: string }
        expiresAt: { type: string, format: date-time }
        status: { type: string, enum: [pending_send, active, consumed, expired, superseded, locked, send_failed] }
    VerificationVerifyResult:
      type: object
      required: [verified]
      properties:
        verified: { type: boolean, const: true }
    MediaResource:
      type: object
      required: [id, name, mime, size, sha256, scopeType, acl, status, selectable, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        mime: { type: string }
        size: { type: integer, format: int64 }
        sha256: { type: string }
        categoryId: { type: string }
        scopeType: { type: string, enum: [system, tenant, org] }
        acl: { type: string, enum: [private, public-read] }
        status: { type: string, enum: [pending, ready, failed, deleting, deleted] }
        selectable: { type: boolean }
        disabledReason: { type: string }
        metadata: { type: object, additionalProperties: { type: string } }
        urlHints: { type: object, additionalProperties: { type: boolean } }
        reconcileKey: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MediaUploadRequest:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
        name: { type: string }
        mime: { type: string }
        acl: { type: string, enum: [private, public-read] }
        categoryId: { type: string }
        metadata: { type: object, additionalProperties: { type: string } }
    MediaResourcePatch:
      type: object
      properties:
        name: { type: string }
        categoryId: { type: string }
        status: { type: string, enum: [ready, deleting] }
        metadata: { type: object, additionalProperties: { type: string } }
    MediaSignedURLRequest:
      type: object
      required: [purpose]
      properties:
        purpose: { type: string, enum: [preview, download] }
        ttlSeconds: { type: integer, minimum: 1, maximum: 3600, default: 900 }
    MediaCategory:
      type: object
      required: [id, name, path, scopeType]
      properties:
        id: { type: string }
        name: { type: string }
        path: { type: string }
        parentId: { type: string }
        scopeType: { type: string, enum: [system, tenant, org] }
        enabled: { type: boolean }
    MediaCategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        parentId: { type: string }
    MediaCategoryPatch:
      type: object
      properties:
        name: { type: string }
        enabled: { type: boolean }
    MediaUsage:
      type: object
      required: [id, resourceId, module, entityType, entityId, field]
      properties:
        id: { type: string }
        resourceId: { type: string }
        module: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        field: { type: string }
        createdAt: { type: string, format: date-time }
    MediaUsageInput:
      type: object
      description: 引用目标资源由路径参数决定；resourceId 仅为旧客户端兼容字段，服务端以路径为准。
      required: [module, entityType, entityId, field]
      properties:
        resourceId:
          type: string
          deprecated: true
          description: 旧客户端兼容字段；如提供也由路径参数覆盖。
        module: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        field: { type: string }
    DictionaryType:
      type: object
      required: [id, code, nameZhCN, nameEnUS, status, sortOrder, systemOwned, cacheVersion, createdAt, updatedAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        orgId: { type: string }
        code: { type: string, minLength: 1, maxLength: 128 }
        nameZhCN: { type: string, maxLength: 191 }
        nameEnUS: { type: string, maxLength: 191 }
        description: { type: string, maxLength: 512 }
        status: { type: string, enum: [active, disabled] }
        sortOrder: { type: integer, minimum: 0 }
        systemOwned: { type: boolean }
        cacheVersion: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DictionaryTypeInput:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 1, maxLength: 128 }
        nameZhCN: { type: string, maxLength: 191 }
        nameEnUS: { type: string, maxLength: 191 }
        description: { type: string, maxLength: 512 }
        status: { type: string, enum: [active, disabled], default: active }
        sortOrder: { type: integer, minimum: 0, default: 0 }
    DictionaryItem:
      type: object
      required: [id, typeCode, value, labelZhCN, labelEnUS, label, status, sortOrder, systemOwned, cacheVersion, createdAt, updatedAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        orgId: { type: string }
        typeCode: { type: string }
        value: { type: string, minLength: 1, maxLength: 191 }
        labelZhCN: { type: string, maxLength: 191 }
        labelEnUS: { type: string, maxLength: 191 }
        label: { type: string }
        description: { type: string, maxLength: 512 }
        tag: { type: string, maxLength: 64 }
        status: { type: string, enum: [active, disabled] }
        sortOrder: { type: integer, minimum: 0 }
        systemOwned: { type: boolean }
        cacheVersion: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DictionaryItemInput:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: { type: string, minLength: 1, maxLength: 191 }
        labelZhCN: { type: string, maxLength: 191 }
        labelEnUS: { type: string, maxLength: 191 }
        description: { type: string, maxLength: 512 }
        tag: { type: string, maxLength: 64 }
        status: { type: string, enum: [active, disabled], default: active }
        sortOrder: { type: integer, minimum: 0, default: 0 }
        enabled: { type: boolean, default: true }
    DictionaryImportRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/DictionaryItemInput' }

    TaskDefinition:
      type: object
      required: [id, tenantId, name, type, payloadSchema, timezone, enabled, concurrency, concurrencyPolicy, timeoutSeconds, maxAttempts, createdAt, updatedAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        orgId: { type: string }
        name: { type: string }
        type: { type: string, enum: [manual, http, webhook] }
        payloadSchema: { type: object, additionalProperties: true }
        cron: { type: string }
        timezone: { type: string }
        enabled: { type: boolean }
        concurrency: { type: integer, minimum: 1 }
        concurrencyPolicy: { type: string, enum: [allow, forbid, replace] }
        timeoutSeconds: { type: integer, minimum: 1 }
        maxAttempts: { type: integer, minimum: 1, maximum: 10 }
        idempotencyKey: { type: string, maxLength: 191 }
        deletedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TaskDefinitionInput:
      type: object
      additionalProperties: false
      required: [name, type, payloadSchema]
      properties:
        name: { type: string, minLength: 1, maxLength: 191 }
        type: { type: string, enum: [manual, http, webhook] }
        payloadSchema: { type: object, additionalProperties: true }
        cron: { type: string, maxLength: 128 }
        timezone: { type: string, default: UTC }
        enabled: { type: boolean, default: true }
        concurrency: { type: integer, minimum: 1, default: 1 }
        concurrencyPolicy: { type: string, enum: [allow, forbid, replace], default: forbid }
        timeoutSeconds: { type: integer, minimum: 1, default: 30 }
        maxAttempts: { type: integer, minimum: 1, maximum: 10, default: 3 }
        idempotencyKey: { type: string, maxLength: 191 }
    TaskRunRequest:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        confirm: { type: boolean, const: true }
        payload: { type: object, additionalProperties: true }
        idempotencyKey: { type: string, maxLength: 191 }
    TaskRun:
      type: object
      required: [id, taskId, tenantId, status, payloadDigest, attemptCount, maxAttempts, createdAt, updatedAt]
      properties:
        id: { type: string }
        taskId: { type: string }
        tenantId: { type: string }
        orgId: { type: string }
        queueTaskId: { type: string }
        idempotencyKey: { type: string }
        status: { type: string, enum: [pending, running, succeeded, failed, dead_letter, cancelled] }
        payloadDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
        attemptCount: { type: integer, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1 }
        lastErrorCode: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TaskRunLog:
      type: object
      required: [id, runId, attempt, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        runId: { type: string }
        attempt: { type: integer, minimum: 0 }
        status: { type: string, enum: [pending, running, succeeded, failed, dead_letter, cancelled] }
        errorCode: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ImportRowError:
      type: object
      required: [row, code, messageKey]
      properties:
        row: { type: integer, minimum: 1 }
        column: { type: string }
        code: { type: string }
        messageKey: { type: string }
    ImportPreview:
      type: object
      required: [id, format, headers, previewRows, totalRows, errors, sizeBytes, sha256, createdAt, expiresAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        orgId: { type: string }
        format: { type: string, enum: [csv, xlsx] }
        headers: { type: array, items: { type: string } }
        mappedColumns: { type: object, additionalProperties: { type: string } }
        previewRows: { type: array, items: { type: object, additionalProperties: { type: string } } }
        totalRows: { type: integer, minimum: 0, maximum: 100000 }
        errors: { type: array, items: { $ref: '#/components/schemas/ImportRowError' } }
        sizeBytes: { type: integer, minimum: 0, maximum: 52428800 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    ImportCommitRequest:
      type: object
      required: [previewId]
      properties:
        previewId: { type: string, minLength: 1, maxLength: 128 }
        idempotencyKey: { type: string, maxLength: 191 }
    ExportRequest:
      type: object
      required: [fields]
      properties:
        fields: { type: array, minItems: 1, items: { type: string } }
        allowlist: { type: object, additionalProperties: { type: boolean } }
        rows: { type: array, maxItems: 100000, items: { type: object, additionalProperties: { type: string } } }
        idempotencyKey: { type: string, maxLength: 191 }
    ImportExportJob:
      type: object
      required: [id, kind, tenantId, idempotencyKey, status, totalRows, processedRows, errorCount, createdAt, updatedAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [import, export] }
        tenantId: { type: string }
        orgId: { type: string }
        actorId: { type: string }
        previewId: { type: string }
        queueTaskId: { type: string }
        idempotencyKey: { type: string }
        status: { type: string, enum: [pending, running, succeeded, failed, cancelled] }
        totalRows: { type: integer, minimum: 0 }
        processedRows: { type: integer, minimum: 0 }
        errorCount: { type: integer, minimum: 0 }
        lastErrorCode: { type: string }
        downloadUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    SMTPAccount:
      type: object
      required: [id, name, enabled, host, port, username, weight, fromEmail, implicitTls, passwordConfigured, createdAt, updatedAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        orgId: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string }
        weight: { type: integer, minimum: 1 }
        fromEmail: { type: string, format: email }
        fromName: { type: string }
        implicitTls: { type: boolean }
        passwordConfigured: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SMTPAccountInput:
      type: object
      required: [name, host, port, fromEmail]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        enabled: { type: boolean, default: true }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string }
        password: { type: string, format: password, writeOnly: true }
        weight: { type: integer, minimum: 1, default: 1 }
        fromEmail: { type: string, format: email }
        fromName: { type: string }
        implicitTls: { type: boolean }
    SMTPConnectionTestResult:
      type: object
      required: [accountId, requestId, status, checkedAt]
      properties:
        accountId: { type: string }
        requestId: { type: string }
        status: { type: string, enum: [ok, failed] }
        stage: { type: string }
        code: { type: string }
        message: { type: string }
        checkedAt: { type: string, format: date-time }
    EmailRecipient:
      type: object
      required: [address, kind]
      properties:
        address: { type: string, format: email }
        kind: { type: string, enum: [to, cc, bcc] }
    EmailMessage:
      type: object
      required: [id, subject, recipients, bodyDigest, status, attemptCount, createdAt, updatedAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        orgId: { type: string }
        smtpAccountId: { type: string }
        senderId: { type: string }
        subject: { type: string }
        recipients: { type: array, items: { $ref: '#/components/schemas/EmailRecipient' } }
