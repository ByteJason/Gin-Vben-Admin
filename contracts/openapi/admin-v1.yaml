        accessToken:
          type: string
          minLength: 1
          description: 短时效 access token；客户端通过 Bearer header 发送
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: access token 有效期（秒）
