        scope: { type: string, enum: [all, own, org, custom] }
        ids:
          type: array
          items: { type: string }
    IAMDataScopeRequest:
      allOf:
        - $ref: '#/components/schemas/IAMDataScope'
    SettingDefinition:
      type: object
