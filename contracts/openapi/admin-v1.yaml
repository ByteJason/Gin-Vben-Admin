openapi: 3.1.0
info:
  title: APP Admin API
  version: 0.1.0-dev
  description: |
    管理端 HTTP API。
servers:
  - url: /
    description: Local development
tags:
  - name: Health
  - name: Admin
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveHealth
      summary: Liveness probe
      responses:
        '200':
          $ref: '#/components/responses/HealthResponse'
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadyHealth
      summary: Readiness probe
      responses:
        '200':
          $ref: '#/components/responses/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/admin/v1/ping:
    get:
      tags: [Admin]
      operationId: adminPing
      summary: 管理端服务连通性检查
      responses:
        '200':
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
components:
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
  schemas:
    HealthData:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready]
    SuccessEnvelope:
      type: object
      required: [code, message, data, traceId, meta]
      properties:
        code:
          type: integer
          const: 0
        message:
          type: string
        data: {}
        traceId:
          type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ErrorEnvelope:
      type: object
      required: [code, message, traceId, meta]
      properties:
        code:
          type: integer
        message:
          type: string
        traceId:
          type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    ResponseMeta:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
    FieldError:
      type: object
      required: [messageKey]
      properties:
        field:
          type: string
        messageKey:
          type: string
        params:
          type: object
          additionalProperties: true
  responses:
    HealthResponse:
      description: 服务存活或就绪
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HealthData'
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: 未认证或凭据错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: 服务未就绪
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  headers:
    RequestId:
      description: 用于跨服务追踪的请求 ID
      schema:
        type: string
