      properties:
        key: { type: string }
        category: { type: string, enum: [basic, security, mail, file, captcha, i18n, other] }
        kind: { type: string, enum: [string, bool, number, json, secret] }
        sensitive: { type: boolean }
        default: { type: string }
        allowed:
          type: array
          items: { type: string }
        description: { type: string }
        restartRequired: { type: boolean }
        envKey: { type: string }
        yamlPath: { type: string }
    SettingData:
      type: object
      required: [key, category, value, version, sensitive, source, restartRequired]
      properties:
        key: { type: string }
        category: { type: string, enum: [basic, security, mail, file, captcha, i18n, other] }
        value: { type: string }
        version: { type: integer, minimum: 0 }
        sensitive: { type: boolean }
        source: { type: string, enum: [env, dotenv, yaml, database, default] }
        restartRequired: { type: boolean }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    SettingUpdateRequest:
      type: object
      required: [value, expectedVersion]
      properties:
        value: {}
        expectedVersion: { type: integer, minimum: 0 }
    SettingRollbackRequest:
      type: object
      required: [version, expectedVersion]
      properties:
        version: { type: integer, minimum: 1 }
        expectedVersion: { type: integer, minimum: 1 }
    SettingConnectionTestRequest:
      type: object
      properties:
        value: {}
    SettingConnectionTest:
      type: object
      required: [key, category, status, source, requestId, checkedAt]
      properties:
        key: { type: string }
        category: { type: string, enum: [basic, security, mail, file, captcha, i18n, other] }
        status: { type: string, enum: [ok, failed] }
        source: { type: string, enum: [env, dotenv, yaml, database, default] }
        requestId: { type: string }
        message: { type: string }
        checkedAt: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, category, action, resource, outcome, requestId, createdAt]
      properties:
        id: { type: string }
        category: { $ref: '#/components/schemas/AuditCategory' }
        actorId: { type: string }
        action: { type: string }
        resource: { type: string }
        outcome: { type: string }
        requestId: { type: string }
        details: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    AuditPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
    AuditRetentionDryRun:
      type: object
      required: [retentionDays, cutoff, matchingCount]
      properties:
        retentionDays: { type: integer, minimum: 1 }
        cutoff: { type: string, format: date-time }
        matchingCount: { type: integer, minimum: 0 }
    ErrorEnvelope:
      type: object
      required: [code, message, data, traceId, meta]
      properties:
        code:
          type: integer
        message:
          type: string
        data: {}
        traceId:
          type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    ResponseMeta:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
    FieldError:
      type: object
      required: [messageKey]
      properties:
        field:
          type: string
        messageKey:
          type: string
        params:
          type: object
          additionalProperties: true
