      type: object
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1, maxLength: 191 }
        nickname: { type: string, maxLength: 191 }
        avatar: { type: string, maxLength: 512 }
        email: { type: string, format: email }
        phone: { type: string, pattern: '^\\+[1-9][0-9]{7,14}$' }
        orgId: { type: string, maxLength: 128 }
        active: { type: boolean }
