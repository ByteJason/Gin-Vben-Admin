        ids:
          type: array
          maxItems: 200
          items: { type: string, minLength: 1, maxLength: 128 }
    IAMRoleDataScopesReplaceRequest:
      type: object
      additionalProperties: false
      required: [scopes]
      properties:
        scopes:
          type: array
          maxItems: 50
