      type: string
      enum: [login, operation, system]
    AuditExportFormat:
      type: string
      enum: [csv, json]
    HealthData:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready, unavailable]
        check:
          type: string
          enum: [live]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [up, down]
    SuccessEnvelope:
      type: object
      required: [code, message, data, traceId, meta]
      properties:
        code:
          type: integer
          const: 0
        message:
          type: string
        data: {}
        traceId:
          type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    EmptySuccessEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: 'null'
    AuthSuccessEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AuthTokenData'
    CaptchaSuccessEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CaptchaChallenge'
    CurrentUserEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CurrentUser'
    AccessCodesEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { type: string }
    CaptchaChallenge:
      type: object
      additionalProperties: false
      required: [id, kind, expiresIn]
      properties:
        id:
          type: string
          minLength: 1
        kind:
          type: string
          description: image、slider、turnstile 或 provider 自定义类型
        payload:
          type: string
          description: 可公开渲染数据（图片 provider 返回 data URI）；答案不作为字段、日志或 Redis 明文保存
        expiresIn:
          type: integer
          minimum: 1
    LoginRequest:
      type: object
      additionalProperties: false
      required: [password]
      anyOf:
        - required: [username]
        - required: [identifier]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
          description: 兼容字段；与 identifier 二选一
        identifier:
          type: string
          minLength: 1
          maxLength: 254
          description: 规范化前的用户名或邮箱
        identifierType:
          type: string
          enum: [username, email]
          description: 可选显式标识类型；服务端会校验与 identifier 一致
        password:
          type: string
          minLength: 1
          maxLength: 256
        captcha:
          type: string
          maxLength: 256
        captchaId:
          type: string
          maxLength: 256
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 8
          maxLength: 128
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
    PasswordResetTokenRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
        password:
          type: string
          minLength: 8
          maxLength: 128
    SessionData:
      type: object
      additionalProperties: false
      required: [id, deviceId, deviceName, ipAddress, userAgent, expiresAt, revoked]
      properties:
        id: { type: string, minLength: 1 }
        deviceId: { type: string }
        deviceName: { type: string }
        ipAddress: { type: string }
        userAgent: { type: string }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        revoked: { type: boolean }
    AuthTokenData:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn]
