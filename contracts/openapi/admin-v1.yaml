      properties:
        id: { type: string }
        key: { type: string }
        name: { type: string }
        mime: { type: string }
        size: { type: integer, format: int64 }
        ownerId: { type: string }
        tenantId: { type: string }
        orgId: { type: string }
        acl: { type: string, enum: [private, public-read] }
        categoryId: { type: string }
        createdAt: { type: string, format: date-time }
        sha256: { type: string }
    FilePage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/FileObject' } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    FileUploadRequest:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
        acl: { type: string, enum: [private, public-read] }
