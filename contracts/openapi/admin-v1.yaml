      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SMTPAccountInput' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/v1/mail/accounts/{id}:
    put:
      tags: [Admin]
      operationId: updateSMTPAccount
      summary: 更新 SMTP 账户
      security: [{BearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SMTPAccountInput' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Admin]
      operationId: deleteSMTPAccount
      summary: 软删除 SMTP 账户
      security: [{BearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/EmptySuccessResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/v1/mail/accounts/{id}/test:
    post:
      tags: [Admin]
      operationId: testSMTPAccount
      summary: 测试 SMTP DNS/TCP/TLS/EHLO/AUTH（不发送邮件）
      security: [{BearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 分阶段连接结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SMTPConnectionTestResult' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/v1/mail/messages:
    get:
      tags: [Admin]
      operationId: listEmailMessages
      summary: 查询脱敏邮件投递记录
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: 邮件记录分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/EmailMessagePage' }
    post:
      tags: [Admin]
      operationId: sendEmailMessage
      summary: 创建并发送邮件
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailMessageInput' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '502': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/admin/v1/mail/messages/{id}:
    get:
      tags: [Admin]
      operationId: getEmailMessage
      summary: 查询邮件投递详情（正文仅受控解密）
      security: [{BearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: includeBody
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/v1/ops/monitor:
    get:
      tags: [Admin]
      operationId: getMonitorOverview
      summary: 获取平台管理员只读运维快照
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: 当前进程/容器与依赖状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MonitorOverview' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '受保护管理端请求使用 Authorization: Bearer TOKEN'
    RefreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly、SameSite=Lax 的 refresh token cookie（生产环境启用 Secure）；不会出现在 JSON 响应中
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    RefreshTokenCookie:
      name: refresh_token
      in: cookie
      required: true
      description: 浏览器自动附带的 HttpOnly refresh token cookie
      schema:
        type: string
        minLength: 1
    SettingKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    FileId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  schemas:

    DictionaryType:
      type: object
      required: [id, code, nameZhCN, nameEnUS, status, sortOrder, systemOwned, cacheVersion, createdAt, updatedAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        orgId: { type: string }
        code: { type: string, minLength: 1, maxLength: 128 }
        nameZhCN: { type: string, maxLength: 191 }
        nameEnUS: { type: string, maxLength: 191 }
        description: { type: string, maxLength: 512 }
        status: { type: string, enum: [active, disabled] }
        sortOrder: { type: integer, minimum: 0 }
        systemOwned: { type: boolean }
        cacheVersion: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DictionaryTypeInput:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 1, maxLength: 128 }
        nameZhCN: { type: string, maxLength: 191 }
        nameEnUS: { type: string, maxLength: 191 }
        description: { type: string, maxLength: 512 }
        status: { type: string, enum: [active, disabled], default: active }
        sortOrder: { type: integer, minimum: 0, default: 0 }
    DictionaryItem:
      type: object
      required: [id, typeCode, value, labelZhCN, labelEnUS, label, status, sortOrder, systemOwned, cacheVersion, createdAt, updatedAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        orgId: { type: string }
        typeCode: { type: string }
        value: { type: string, minLength: 1, maxLength: 191 }
        labelZhCN: { type: string, maxLength: 191 }
        labelEnUS: { type: string, maxLength: 191 }
        label: { type: string }
        description: { type: string, maxLength: 512 }
        tag: { type: string, maxLength: 64 }
        status: { type: string, enum: [active, disabled] }
        sortOrder: { type: integer, minimum: 0 }
        systemOwned: { type: boolean }
        cacheVersion: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DictionaryItemInput:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: { type: string, minLength: 1, maxLength: 191 }
        labelZhCN: { type: string, maxLength: 191 }
        labelEnUS: { type: string, maxLength: 191 }
        description: { type: string, maxLength: 512 }
        tag: { type: string, maxLength: 64 }
        status: { type: string, enum: [active, disabled], default: active }
        sortOrder: { type: integer, minimum: 0, default: 0 }
        enabled: { type: boolean, default: true }
    DictionaryImportRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/DictionaryItemInput' }

    SMTPAccount:
      type: object
      required: [id, name, enabled, host, port, username, weight, fromEmail, implicitTls, passwordConfigured, createdAt, updatedAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        orgId: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string }
        weight: { type: integer, minimum: 1 }
        fromEmail: { type: string, format: email }
        fromName: { type: string }
        implicitTls: { type: boolean }
        passwordConfigured: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SMTPAccountInput:
      type: object
      required: [name, host, port, fromEmail]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        enabled: { type: boolean, default: true }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string }
        password: { type: string, format: password, writeOnly: true }
        weight: { type: integer, minimum: 1, default: 1 }
        fromEmail: { type: string, format: email }
        fromName: { type: string }
        implicitTls: { type: boolean }
    SMTPConnectionTestResult:
      type: object
      required: [accountId, requestId, status, checkedAt]
      properties:
        accountId: { type: string }
        requestId: { type: string }
        status: { type: string, enum: [ok, failed] }
        stage: { type: string }
        code: { type: string }
        message: { type: string }
        checkedAt: { type: string, format: date-time }
    EmailRecipient:
      type: object
      required: [address, kind]
      properties:
        address: { type: string, format: email }
        kind: { type: string, enum: [to, cc, bcc] }
    EmailMessage:
      type: object
      required: [id, subject, recipients, bodyDigest, status, attemptCount, createdAt, updatedAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        orgId: { type: string }
        smtpAccountId: { type: string }
        senderId: { type: string }
        subject: { type: string }
        recipients: { type: array, items: { $ref: '#/components/schemas/EmailRecipient' } }
        body: { type: string, readOnly: true }
        bodyDigest: { type: string }
        status: { type: string, enum: [pending, sending, retrying, sent, failed] }
        attemptCount: { type: integer }
        providerMessageId: { type: string }
        lastErrorCode: { type: string }
        sentAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EmailMessageInput:
      type: object
      required: [recipients, subject, body]
      properties:
        recipients: { type: array, minItems: 1, items: { type: string, format: email } }
        subject: { type: string }
        body: { type: string, writeOnly: true }
        idempotencyKey: { type: string }
    EmailMessagePage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/EmailMessage' } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    MonitorMetric:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded, unavailable] }
        cores: { type: integer }
        load1: { type: number }
        usedBytes: { type: integer, format: int64 }
        totalBytes: { type: integer, format: int64 }
        utilization: { type: number }
        latencyMs: { type: number }
        poolOpen: { type: integer }
        poolIdle: { type: integer }
        poolMax: { type: integer }
        keyspace: { type: integer, format: int64 }
        message: { type: string }
    MonitorOverview:
      type: object
      required: [scope, uptimeSeconds, cpu, memory, disk, database, redis, collectedAt]
      properties:
        scope: { type: string, enum: [process, container] }
        uptimeSeconds: { type: number }
        version: { type: string }
        cpu: { $ref: '#/components/schemas/MonitorMetric' }
        memory: { $ref: '#/components/schemas/MonitorMetric' }
        disk: { $ref: '#/components/schemas/MonitorMetric' }
        database: { $ref: '#/components/schemas/MonitorMetric' }
        redis: { $ref: '#/components/schemas/MonitorMetric' }
        collectedAt: { type: string, format: date-time }
    AuditCategory:
      type: string
      enum: [login, operation, system]
    AuditExportFormat:
      type: string
      enum: [csv, json]
    HealthData:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready, unavailable]
        check:
          type: string
          enum: [live]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [up, down]
    SuccessEnvelope:
      type: object
      required: [code, message, data, traceId, meta]
      properties:
        code:
          type: integer
          const: 0
        message:
          type: string
        data: {}
        traceId:
          type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    EmptySuccessEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: 'null'
    AuthSuccessEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AuthTokenData'
    CaptchaSuccessEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CaptchaChallenge'
    CurrentUserEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CurrentUser'
    CaptchaChallenge:
      type: object
      additionalProperties: false
      required: [id, kind, expiresIn]
      properties:
        id:
          type: string
          minLength: 1
        kind:
          type: string
          description: image、slider、turnstile 或 provider 自定义类型
        payload:
          type: string
          description: 可公开渲染数据（图片 provider 返回 data URI）；答案不作为字段、日志或 Redis 明文保存
        expiresIn:
          type: integer
          minimum: 1
    LoginRequest:
      type: object
      additionalProperties: false
      required: [password]
      anyOf:
        - required: [username]
        - required: [identifier]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
          description: 兼容字段；与 identifier 二选一
        identifier:
          type: string
          minLength: 1
          maxLength: 254
          description: 规范化前的用户名或邮箱
        identifierType:
          type: string
          enum: [username, email]
          description: 可选显式标识类型；服务端会校验与 identifier 一致
        password:
          type: string
          minLength: 1
          maxLength: 256
        captcha:
          type: string
          maxLength: 256
        captchaId:
          type: string
          maxLength: 256
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 8
          maxLength: 128
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
    PasswordResetTokenRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
        password:
          type: string
          minLength: 8
          maxLength: 128
    SessionData:
      type: object
      additionalProperties: false
      required: [id, deviceId, deviceName, ipAddress, userAgent, expiresAt, revoked]
      properties:
        id: { type: string, minLength: 1 }
        deviceId: { type: string }
        deviceName: { type: string }
        ipAddress: { type: string }
        userAgent: { type: string }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        revoked: { type: boolean }
    AuthTokenData:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          minLength: 1
          description: 短时效 access token；客户端通过 Bearer header 发送
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: access token 有效期（秒）
    IAMUser:
      type: object
      required: [id, username, active, roleIds]
      properties:
        id: { type: string, minLength: 1 }
        username: { type: string, minLength: 1 }
        displayName: { type: string }
        nickname: { type: string }
        avatar: { type: string }
        email: { type: string, format: email }
        phone: { type: string, pattern: '^\\+[1-9][0-9]{7,14}$' }
        lastLoginIp: { type: string }
        lastLoginAt: { type: string, format: date-time }
        passwordChangedAt: { type: string, format: date-time }
        tenantId: { type: string }
        orgId: { type: string }
        active: { type: boolean }
        status: { type: string, enum: [active, disabled] }
        roleIds:
          type: array
          items: { type: string }
    IAMUserPage:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/IAMUser' }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
    CurrentUser:
      type: object
      additionalProperties: false
      required: [userId, username, realName, avatar, roles, homePath, desc]
      properties:
        userId: { type: string, minLength: 1 }
        username: { type: string, minLength: 1 }
        realName: { type: string }
        avatar: { type: string }
        nickname: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        lastLoginIp: { type: string }
        lastLoginAt: { type: string, format: date-time }
        passwordChangedAt: { type: string, format: date-time }
        roles:
          type: array
          items: { type: string }
        homePath: { type: string }
        desc: { type: string }
    IAMUserCreateRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 191 }
        nickname: { type: string, maxLength: 191 }
        avatar: { type: string, maxLength: 512 }
        email: { type: string, format: email }
        phone: { type: string, pattern: '^\\+[1-9][0-9]{7,14}$' }
        orgId: { type: string, maxLength: 128 }
        active: { type: boolean, default: true }
        password: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
    IAMUserUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1, maxLength: 191 }
        nickname: { type: string, maxLength: 191 }
        avatar: { type: string, maxLength: 512 }
        email: { type: string, format: email }
        phone: { type: string, pattern: '^\\+[1-9][0-9]{7,14}$' }
        orgId: { type: string, maxLength: 128 }
        active: { type: boolean }
    IAMUserBatchStatusRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/IAMUserBatchStatusItem' }
    IAMUserBatchStatusItem:
      type: object
      additionalProperties: false
      required: [id, active]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        active: { type: boolean }
    IAMUserBatchStatusResponse:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/IAMUserBatchStatusResult' }
    IAMUserBatchStatusResult:
      type: object
      additionalProperties: false
      required: [id, status, code]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [active, disabled, not_found, forbidden, invalid, error]
        code: { type: integer, minimum: 0 }
    IAMUserPasswordResetRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
    IAMUserRequest:
      allOf:
        - $ref: '#/components/schemas/IAMUserCreateRequest'
    IAMRole:
      type: object
      required: [id, name, active, dataScope]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        active: { type: boolean }
        dataScope: { type: string, enum: [all, own, org, custom] }
        userIds:
          type: array
          items: { type: string }
        permissionIds:
          type: array
          items: { type: string }
    IAMRoleRequest:
      allOf:
        - $ref: '#/components/schemas/IAMRole'
    IAMRoleUsersReplaceRequest:
      type: object
      additionalProperties: false
      required: [userIds]
      properties:
        userIds:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 128 }
    IAMRolePermissionsReplaceRequest:
      type: object
      additionalProperties: false
      required: [permissionIds]
      properties:
        permissionIds:
          type: array
          maxItems: 200
          items: { type: string, minLength: 1, maxLength: 128 }
    IAMRoleDataScopeBinding:
      type: object
      additionalProperties: false
      required: [resource, scope, ids]
      properties:
        resource: { type: string, minLength: 1, maxLength: 191 }
        scope: { type: string, enum: [all, own, org, custom] }
        ids:
          type: array
          maxItems: 200
          items: { type: string, minLength: 1, maxLength: 128 }
    IAMRoleDataScopesReplaceRequest:
      type: object
      additionalProperties: false
      required: [scopes]
      properties:
        scopes:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/IAMRoleDataScopeBinding' }
    IAMMenu:
      type: object
      additionalProperties: false
      required: [id, name, path, type, component, redirect, icon, sort, visible, active, keepAlive, external, permission]
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        parentId: { type: string, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 191 }
        path: { type: string, minLength: 1, maxLength: 255 }
        type: { type: string, enum: [directory, menu, button] }
        component: { type: string, maxLength: 255 }
        redirect: { type: string, maxLength: 255 }
        icon: { type: string, maxLength: 191 }
        sort: { type: integer, minimum: -1000000, maximum: 1000000 }
        visible: { type: boolean }
        active: { type: boolean }
        keepAlive: { type: boolean }
        external: { type: boolean }
        permission: { type: string, maxLength: 191 }
        tenantId: { type: string, maxLength: 128 }
        orgId: { type: string, maxLength: 128 }
    IAMMenuCreateRequest:
      type: object
      additionalProperties: false
      required: [id, name, path, type]
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        parentId: { type: string, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 191 }
        path: { type: string, minLength: 1, maxLength: 255 }
        type: { type: string, enum: [directory, menu, button] }
        component: { type: string, maxLength: 255 }
        redirect: { type: string, maxLength: 255 }
        icon: { type: string, maxLength: 191 }
        sort: { type: integer, minimum: -1000000, maximum: 1000000, default: 0 }
        visible: { type: boolean, default: true }
        active: { type: boolean, default: true }
        keepAlive: { type: boolean, default: false }
        external: { type: boolean, default: false }
        permission: { type: string, maxLength: 191 }
        orgId: { type: string, maxLength: 128 }
    IAMMenuPatchRequest:
      type: object
      additionalProperties: false
      properties:
        parentId: { type: string, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 191 }
        path: { type: string, minLength: 1, maxLength: 255 }
        type: { type: string, enum: [directory, menu, button] }
        component: { type: string, maxLength: 255 }
        redirect: { type: string, maxLength: 255 }
        icon: { type: string, maxLength: 191 }
        sort: { type: integer, minimum: -1000000, maximum: 1000000 }
        visible: { type: boolean }
        active: { type: boolean }
        keepAlive: { type: boolean }
        external: { type: boolean }
        permission: { type: string, maxLength: 191 }
        orgId: { type: string, maxLength: 128 }
    IAMMenuReorderRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [id, sort]
            properties:
              id: { type: string, minLength: 1, maxLength: 64 }
              parentId: { type: string, maxLength: 64 }
              sort: { type: integer, minimum: -1000000, maximum: 1000000 }
    IAMMenuRoute:
      type: object
      additionalProperties: false
      required: [name, path, component, meta]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        path: { type: string, minLength: 1, maxLength: 255 }
        component: { type: string, minLength: 1, maxLength: 255 }
        redirect: { type: string, maxLength: 255 }
        meta:
          type: object
          additionalProperties: false
          required: [title, order]
          properties:
            title: { type: string, minLength: 1, maxLength: 191 }
            icon: { type: string, maxLength: 191 }
            order: { type: integer }
            hideInMenu: { type: boolean }
            keepAlive: { type: boolean }
            link: { type: string, maxLength: 255 }
            openInNewWindow: { type: boolean }
            authority:
              type: array
              maxItems: 1
              items: { type: string, maxLength: 191 }
        children:
          type: array
          items: { $ref: '#/components/schemas/IAMMenuRoute' }
    IAMComponent:
      type: object
      additionalProperties: false
      required: [id, component, label, kind]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        component: { type: string, minLength: 1, maxLength: 255 }
        label: { type: string, minLength: 1, maxLength: 191 }
        kind: { type: string, enum: [layout, page] }
    IAMPermission:
      type: object
      required: [id, name, method, path, active]
      properties:
        id: { type: string }
        name: { type: string }
        method: { type: string }
        path: { type: string }
        active: { type: boolean }
    IAMPolicy:
      type: object
      required: [method, path, effect]
      properties:
        subject: { type: string }
        roleId: { type: string }
        domain: { type: string }
        method: { type: string }
        path: { type: string }
        effect: { type: string, enum: [allow, deny] }
    IAMPolicyRequest:
      allOf:
        - $ref: '#/components/schemas/IAMPolicy'
    IAMDataScope:
      type: object
      required: [resource, scope, ids]
      properties:
        subject: { type: string }
        roleId: { type: string }
        domain: { type: string }
        resource: { type: string }
        scope: { type: string, enum: [all, own, org, custom] }
        ids:
          type: array
          items: { type: string }
    IAMDataScopeRequest:
      allOf:
        - $ref: '#/components/schemas/IAMDataScope'
    SettingDefinition:
      type: object
      required: [key, category, kind, sensitive, restartRequired]
      properties:
        key: { type: string }
        category: { type: string, enum: [basic, security, mail, file, captcha, i18n, other] }
        kind: { type: string, enum: [string, bool, number, json, secret] }
        sensitive: { type: boolean }
        default: { type: string }
        allowed:
          type: array
          items: { type: string }
        description: { type: string }
        restartRequired: { type: boolean }
        envKey: { type: string }
        yamlPath: { type: string }
    SettingData:
      type: object
      required: [key, category, value, version, sensitive, source, restartRequired]
      properties:
        key: { type: string }
        category: { type: string, enum: [basic, security, mail, file, captcha, i18n, other] }
        value: { type: string }
        version: { type: integer, minimum: 0 }
        sensitive: { type: boolean }
        source: { type: string, enum: [env, dotenv, yaml, database, default] }
        restartRequired: { type: boolean }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    SettingUpdateRequest:
      type: object
      required: [value, expectedVersion]
      properties:
        value: {}
        expectedVersion: { type: integer, minimum: 0 }
    SettingRollbackRequest:
      type: object
      required: [version, expectedVersion]
      properties:
        version: { type: integer, minimum: 1 }
        expectedVersion: { type: integer, minimum: 1 }
    SettingConnectionTestRequest:
      type: object
      properties:
        value: {}
    SettingConnectionTest:
      type: object
      required: [key, category, status, source, requestId, checkedAt]
      properties:
        key: { type: string }
        category: { type: string, enum: [basic, security, mail, file, captcha, i18n, other] }
        status: { type: string, enum: [ok, failed] }
        source: { type: string, enum: [env, dotenv, yaml, database, default] }
        requestId: { type: string }
        message: { type: string }
        checkedAt: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, category, action, resource, outcome, requestId, createdAt]
      properties:
        id: { type: string }
        category: { $ref: '#/components/schemas/AuditCategory' }
        actorId: { type: string }
        action: { type: string }
        resource: { type: string }
        outcome: { type: string }
        requestId: { type: string }
        details: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    AuditPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
    AuditRetentionDryRun:
      type: object
      required: [retentionDays, cutoff, matchingCount]
      properties:
        retentionDays: { type: integer, minimum: 1 }
        cutoff: { type: string, format: date-time }
        matchingCount: { type: integer, minimum: 0 }
    ErrorEnvelope:
      type: object
      required: [code, message, data, traceId, meta]
      properties:
        code:
          type: integer
        message:
          type: string
        data: {}
        traceId:
          type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    ResponseMeta:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
    FieldError:
      type: object
      required: [messageKey]
      properties:
        field:
          type: string
        messageKey:
          type: string
        params:
          type: object
          additionalProperties: true
  responses:
    SuccessResponse:
      description: 请求成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
    Conflict:
      description: 资源唯一约束冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    CollectionResponse:
      description: 集合查询成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
    SettingDefinitionsResponse:
      description: 设置定义查询成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SettingDefinition' }
    SettingResponse:
      description: 设置读取或写入成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/SettingData' }
    SettingHistoryResponse:
      description: 设置历史查询成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SettingData' }
    SettingConnectionTestResponse:
      description: 设置连接测试结果
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/SettingConnectionTest' }
    AuditPageResponse:
      description: 审计事件查询成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/AuditPage' }
    AuditExportResponse:
      description: 脱敏审计事件文件
      content:
        text/csv:
          schema: { type: string, format: binary }
        application/json:
          schema: { type: string, format: binary }
    AuditRetentionDryRunResponse:
      description: 审计留存清理预览
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/AuditRetentionDryRun' }
    FilePageResponse:
      description: 文件元数据分页
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/FilePage' }
    FileResponse:
      description: 文件元数据
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/FileObject' }
    EmptySuccessResponse:
      description: 操作成功
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EmptySuccessEnvelope' }
    FileBinaryResponse:
      description: 文件二进制内容
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    FileSignedURLResponse:
      description: 短期签名 URL
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/FileSignedURL' }
    FileCleanupDryRunResponse:
      description: 文件清理预览
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/FileCleanupDryRun' }
    FileTooLarge:
      description: 文件超过单文件大小限制
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    FileMIMERejected:
      description: 文件 MIME 类型不允许
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    IAMUserConflict:
      description: 用户名或邮箱在当前租户内已存在
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    const: 10011
    SettingConflict:
      description: 设置版本已变化，需要重新读取后再写入
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    const: 10010
    NotFound:
      description: 资源不存在
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    const: 10001
    Forbidden:
      description: 当前主体没有资源权限；服务端默认拒绝
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    const: 30000
    HealthResponse:
      description: 服务存活或就绪
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HealthData'
    BadRequest:
      description: 请求参数错误
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    const: 10000
    ValidationFailed:
      description: 请求字段通过语法解析但未通过业务校验
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    const: 10001
    LoginBadRequest:
      description: 登录请求字段或验证码无效
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    enum: [10000, 10005]
    Unauthorized:
      description: 未认证或凭据错误
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    enum: [10002, 10003, 20000]
    ServiceUnavailable:
      description: 服务未就绪
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    const: 40001
                  data:
                    $ref: '#/components/schemas/HealthData'
    RateLimited:
      description: 登录尝试超过账号或来源限制
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    const: 10004
    AuthServiceUnavailable:
      description: 认证依赖不可用或认证未启用
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    const: 40001
  headers:
    RequestId:
      description: 用于跨服务追踪的请求 ID
      schema:
        type: string
    RefreshCookie:
      description: refresh token；服务端必须设置 HttpOnly、SameSite=Lax 和 Path 属性，生产环境启用 Secure
      schema:
        type: string
        example: refresh_token=TOKEN; Path=/api/admin/v1/auth; HttpOnly; SameSite=Lax
    ClearedRefreshCookie:
      description: 过期的 refresh token cookie，用于登出清理
      schema:
        type: string
        example: refresh_token=; Max-Age=0; Path=/api/admin/v1/auth; HttpOnly; SameSite=Lax
