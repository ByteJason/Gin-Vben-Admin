openapi: 3.1.0
info:
  title: APP Admin API
  version: 0.2.0-dev
  description: |
    管理端 HTTP API。
servers:
  - url: /
    description: Local development
tags:
  - name: Health
  - name: Admin
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveHealth
      summary: Liveness probe
      responses:
        '200':
          $ref: '#/components/responses/HealthResponse'
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadyHealth
      summary: Readiness probe
      responses:
        '200':
          $ref: '#/components/responses/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/admin/v1/ping:
    get:
      tags: [Admin]
      operationId: adminPing
      summary: 管理端服务连通性检查
      responses:
        '200':
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/admin/v1/auth/captcha:
    get:
      tags: [Admin]
      operationId: issueAdminAuthCaptcha
      summary: 获取当前验证码 provider 的一次性挑战
      responses:
        '200':
          description: 验证码挑战已签发；响应不包含答案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaSuccessEnvelope'
        '503':
          $ref: '#/components/responses/AuthServiceUnavailable'
  /api/admin/v1/auth/login:
    post:
      tags: [Admin]
      operationId: adminAuthLogin
      summary: 管理端登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              credentials:
                value:
                  username: USERNAME
                  password: PASSWORD
      responses:
        '200':
          description: 登录成功；refresh token 只通过 HttpOnly cookie 返回
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessEnvelope'
        '400':
          $ref: '#/components/responses/LoginBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthServiceUnavailable'
  /api/admin/v1/auth/refresh:
    post:
      tags: [Admin]
      operationId: adminAuthRefresh
      summary: 使用 refresh cookie 轮换 access token
      security:
        - RefreshCookie: []
      parameters:
        - $ref: '#/components/parameters/RefreshTokenCookie'
      responses:
        '200':
          description: access token 轮换成功；旧 refresh token 立即失效
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AuthServiceUnavailable'
  /api/admin/v1/auth/logout:
    post:
      tags: [Admin]
      operationId: adminAuthLogout
      summary: 吊销当前 refresh session
      security:
        - RefreshCookie: []
      parameters:
        - $ref: '#/components/parameters/RefreshTokenCookie'
      responses:
        '200':
          description: 登出成功；refresh cookie 被清除
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/ClearedRefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AuthServiceUnavailable'
  /api/admin/v1/auth/register:
    post:
      tags: [Admin]
      operationId: adminAuthRegister
      summary: 创建管理端账号（按配置开关开放）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/AuthServiceUnavailable'
  /api/admin/v1/auth/password/reset/request:
    post:
      tags: [Admin]
      operationId: requestAdminPasswordReset
      summary: 请求一次性密码重置（不暴露账号是否存在）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/AuthServiceUnavailable'
  /api/admin/v1/auth/password/reset:
    post:
      tags: [Admin]
      operationId: resetAdminPassword
      summary: 使用一次性 token 设置新密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetTokenRequest'
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AuthServiceUnavailable'
  /api/admin/v1/auth/sessions:
    get:
      tags: [Admin]
      operationId: listAdminAuthSessions
      summary: 查询当前账号的设备会话
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AuthServiceUnavailable'
  /api/admin/v1/auth/sessions/{id}:
    delete:
      tags: [Admin]
      operationId: revokeAdminAuthSession
      summary: 吊销当前账号的指定设备会话
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AuthServiceUnavailable'
  /api/admin/v1/iam/me:
    get:
      tags: [IAM]
      operationId: getCurrentAdminUser
      summary: 查询当前管理端用户资料
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: 当前用户资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/AuthServiceUnavailable' }
  /api/admin/v1/iam/users:
    get:
      tags: [IAM]
      operationId: listIAMUsers
      summary: 查询管理用户
      security: [{BearerAuth: []}]
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: keyword
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [all, active, disabled] }
        - name: roleId
          in: query
          required: false
          schema: { type: string }
        - name: orgId
          in: query
          required: false
          schema: { type: string }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [id, -id, username, -username, displayName, -displayName, email, -email, lastLoginAt, -lastLoginAt, orgId, -orgId] }
      responses:
        '200':
          description: 分页用户查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/IAMUserPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/AuthServiceUnavailable' }
    post:
      tags: [IAM]
      operationId: createIAMUser
      summary: 保存管理用户
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IAMUserCreateRequest' }
      responses:
        '200':
          description: 用户创建成功；密码永不回显
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/IAMUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IAMUserConflict' }
        '503': { $ref: '#/components/responses/AuthServiceUnavailable' }
  /api/admin/v1/iam/users/batch-status:
    post:
      tags: [IAM]
      operationId: batchUpdateIAMUserStatus
      summary: 批量更新管理用户状态
      description: 在当前租户和组织范围内逐项更新 active 状态；每项返回独立结果，最多 100 项。
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IAMUserBatchStatusRequest' }
      responses:
        '200':
          description: 批量状态更新结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/IAMUserBatchStatusResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/AuthServiceUnavailable' }
  /api/admin/v1/iam/users/{id}/login-events:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
    get:
      tags: [IAM]
      operationId: listIAMUserLoginEvents
      summary: 查询用户登录记录
      description: 只返回当前 tenant/org 范围内的 auth.login 审计记录，默认最近 50 条，最多 200 条；详情经过敏感字段脱敏。
      security: [{BearerAuth: []}]
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200': { $ref: '#/components/responses/AuditPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AuthServiceUnavailable' }
  /api/admin/v1/iam/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    get:
      tags: [IAM]
      operationId: getIAMUser
      summary: 查询单个管理用户
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: 用户详情查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/IAMUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AuthServiceUnavailable' }
    patch:
      tags: [IAM]
      operationId: updateIAMUser
      summary: 更新管理用户资料与状态
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IAMUserUpdateRequest' }
      responses:
        '200':
          description: 用户更新成功；密码永不回显
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/IAMUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IAMUserConflict' }
        '503': { $ref: '#/components/responses/AuthServiceUnavailable' }
    delete:
      tags: [IAM]
      operationId: deleteIAMUser
      summary: 默认软删除管理用户
      description: 将用户状态置为 disabled，保留资料、凭据和关系；重复请求幂等成功。
      security: [{BearerAuth: []}]
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AuthServiceUnavailable' }
  /api/admin/v1/iam/roles:
    get:
      tags: [IAM]
      operationId: listIAMRoles
      summary: 查询角色
      security: [{BearerAuth: []}]
      responses:
        '200': { $ref: '#/components/responses/CollectionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [IAM]
      operationId: createIAMRole
      summary: 保存角色
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IAMRoleRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/v1/iam/menus:
    get:
      tags: [IAM]
      operationId: listIAMMenus
      summary: 查询菜单
      security: [{BearerAuth: []}]
      responses:
        '200': { $ref: '#/components/responses/CollectionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [IAM]
      operationId: createIAMMenu
      summary: 创建菜单
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IAMMenuCreateRequest' }
      responses:
        '200':
          description: 菜单创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/IAMMenu' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IAMUserConflict' }
        '503': { $ref: '#/components/responses/AuthServiceUnavailable' }
  /api/admin/v1/iam/menus/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 64 }
    patch:
      tags: [IAM]
      operationId: updateIAMMenu
      summary: 更新菜单元数据
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IAMMenuPatchRequest' }
      responses:
        '200':
          description: 菜单更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/IAMMenu' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AuthServiceUnavailable' }
    get:
      tags: [IAM]
      operationId: getIAMMenu
      summary: 查询单个菜单
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: 菜单详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/IAMMenu' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AuthServiceUnavailable' }
    delete:
      tags: [IAM]
      operationId: deleteIAMMenu
      summary: 删除菜单
      security: [{BearerAuth: []}]
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IAMUserConflict' }
        '503': { $ref: '#/components/responses/AuthServiceUnavailable' }
  /api/admin/v1/iam/menus/reorder:
    put:
      tags: [IAM]
      operationId: reorderIAMMenus
      summary: 原子调整菜单顺序与父级
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IAMMenuReorderRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AuthServiceUnavailable' }
  /api/admin/v1/iam/components:
    get:
      tags: [IAM]
      operationId: listIAMComponents
      summary: 查询菜单组件注册表
      description: 返回服务端允许菜单引用的有限组件白名单；客户端不得提交任意模块路径。
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: 组件注册表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/IAMComponent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/AuthServiceUnavailable' }
  /api/admin/v1/menu/all:
    get:
      tags: [IAM]
      operationId: listVisibleMenus
      summary: 查询当前用户菜单
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: 当前用户可见动态路由
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/IAMMenuRoute' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/v1/iam/permissions:
    get:
      tags: [IAM]
      operationId: listIAMPermissions
      summary: 查询 API 权限
      security: [{BearerAuth: []}]
      responses:
        '200': { $ref: '#/components/responses/CollectionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/v1/iam/policies:
    get:
      tags: [IAM]
      operationId: listIAMPolicies
      summary: 查询授权策略
      security: [{BearerAuth: []}]
      responses:
        '200': { $ref: '#/components/responses/CollectionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [IAM]
      operationId: createIAMPolicy
      summary: 保存授权策略
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IAMPolicyRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/v1/iam/data-scopes:
    get:
      tags: [IAM]
      operationId: listIAMDataScopes
      summary: 查询数据范围
      security: [{BearerAuth: []}]
      responses:
        '200': { $ref: '#/components/responses/CollectionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [IAM]
      operationId: createIAMDataScope
      summary: 保存数据范围
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IAMDataScopeRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
