      description: 服务未就绪
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    const: 40001
                  data:
                    $ref: '#/components/schemas/HealthData'
    RateLimited:
      description: 登录尝试超过账号或来源限制
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    const: 10004
    AuthServiceUnavailable:
      description: 认证依赖不可用或认证未启用
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    const: 40001
  headers:
    RequestId:
      description: 用于跨服务追踪的请求 ID
      schema:
        type: string
    RefreshCookie:
      description: refresh token；服务端必须设置 HttpOnly、SameSite=Lax 和 Path 属性，生产环境启用 Secure
      schema:
        type: string
        example: refresh_token=TOKEN; Path=/api/admin/v1/auth; HttpOnly; SameSite=Lax
    ClearedRefreshCookie:
      description: 过期的 refresh token cookie，用于登出清理
      schema:
        type: string
        example: refresh_token=; Max-Age=0; Path=/api/admin/v1/auth; HttpOnly; SameSite=Lax
