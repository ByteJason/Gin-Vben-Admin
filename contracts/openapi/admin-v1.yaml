  /api/admin/v1/media/resources/{id}/open:
    get:
      tags: [Media]
      operationId: openMediaResource
      summary: 受控读取媒体资源
      security: [{BearerAuth: []}]
      parameters:
        - { $ref: '#/components/parameters/MediaResourceId' }
        - name: Range
          in: header
          required: false
          description: 可选的单个 RFC 9110 bytes 范围；多范围请求返回 416。
          schema: { type: string, example: bytes=0-1023 }
      responses:
        '200': { $ref: '#/components/responses/MediaBinaryResponse' }
        '206': { $ref: '#/components/responses/MediaBinaryResponse' }
        '416':
          description: 不支持的或超出边界的字节范围
          headers:
            Accept-Ranges:
              description: 支持的范围单位
              schema: { type: string, example: bytes }
            Content-Range:
              description: 当前表示的有效范围；无可满足范围时返回 bytes */size
              schema: { type: string, example: 'bytes */2048' }
