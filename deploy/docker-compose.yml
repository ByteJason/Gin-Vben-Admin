name: gin-vben-admin

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gin_vben_admin}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    entrypoint: ["/migrate"]
    command: ["up"]
    environment:
      SERVER_ADDR: ":8080"
      DATABASE_ENABLED: "true"
      DATABASE_DRIVER: mysql
      DATABASE_MODE: single
      DATABASE_DSN: "${DATABASE_DSN:-app:app_password@tcp(mysql:3306)/gin_vben_admin?charset=utf8mb4&parseTime=true&loc=UTC}"
      REDIS_ENABLED: "false"
      AUTH_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy

  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    restart: unless-stopped
    environment:
      SERVER_ADDR: ":8080"
      DATABASE_ENABLED: "true"
      DATABASE_DRIVER: mysql
      DATABASE_MODE: single
      DATABASE_DSN: "${DATABASE_DSN:-app:app_password@tcp(mysql:3306)/gin_vben_admin?charset=utf8mb4&parseTime=true&loc=UTC}"
      REDIS_ENABLED: "true"
      REDIS_MODE: single
      REDIS_ADDR: redis:6379
      REDIS_NAMESPACE: app:v1
      AUTH_ENABLED: "${AUTH_ENABLED:-false}"
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:-local-runtime-key-change-me-please-32-bytes}"
      MAIL_ENABLED: "${MAIL_ENABLED:-false}"
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  admin:
    build:
      context: ..
      dockerfile: deploy/admin.Dockerfile
      args:
        UI_APP: ${UI_APP:-web-antd}
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-5173}:80"
    depends_on:
      server:
        condition: service_started

volumes:
  mysql-data:
  redis-data:
