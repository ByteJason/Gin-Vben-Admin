name: gin-vben-admin

services:
  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    environment:
      SERVER_ADDR: ":8080"
      DATABASE_ENABLED: "true"
      DATABASE_DRIVER: mysql
      DATABASE_MODE: single
      DATABASE_DSN: "${DATABASE_DSN:-app:app_password@tcp(mysql:3306)/gin_vben_admin?charset=utf8mb4&parseTime=true&loc=UTC}"
      REDIS_ENABLED: "true"
      REDIS_MODE: single
      REDIS_ADDR: redis:6379
      REDIS_NAMESPACE: gin-vben-admin:v1
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
      args:
        UI_APP: ${UI_APP:-web-antd}
    ports:
      - "${ADMIN_PORT:-5173}:80"
    depends_on:
      server:
        condition: service_started

  mysql:
    image: mysql:9.7
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gin_vben_admin}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    profiles: ["postgres"]
    image: postgres:18.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gin_vben_admin}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.10
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  postgres-data:
  redis-data:
