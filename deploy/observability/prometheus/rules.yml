groups:
  - name: gin-vben-admin-rc
    rules:
      - alert: GinVbenReadinessDown
        expr: up{job="gin-vben-admin"} == 0
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "readiness dependency is unavailable"}
      - alert: GinVbenHTTP5xxRateHigh
        expr: sum(rate(app_http_requests_total{job="gin-vben-admin",status=~"5.."}[5m])) / clamp_min(sum(rate(app_http_requests_total{job="gin-vben-admin"}[5m])), 1) > 0.05
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "HTTP 5xx rate is above 5%"}
      - alert: GinVbenHTTPP95ProxyHigh
        expr: sum(rate(app_http_request_duration_seconds_sum{job="gin-vben-admin"}[5m])) / clamp_min(sum(rate(app_http_request_duration_seconds_count{job="gin-vben-admin"}[5m])), 1) > 0.8
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "request duration proxy is above 800ms"}
      - alert: GinVbenOTLPDrops
        expr: increase(app_observability_export_dropped_total{job="gin-vben-admin"}[5m]) > 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "OTLP exporter dropped spans"}
      - alert: GinVbenDependencyDown
        expr: up{job=~"gin-vben-admin|mysql|postgres|redis"} == 0
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "application or dependency target is down"}
